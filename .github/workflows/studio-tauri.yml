# PaperPilot Studio (Tauri edition) — Windows build.
# Lives at repo root: .github/workflows/studio-tauri.yml
# Builds on windows-latest (Tauri links the platform webview, so the Windows
# binary must be built on Windows) and, for studio-tauri-v* tags, publishes
# the installers to a GitHub release.
name: Studio Tauri (Windows)

on:
  push:
    tags:
      - 'studio-tauri-v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: studio-tauri/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: studio-tauri
        run: npm ci

      - name: Build the Tauri app
        working-directory: studio-tauri
        run: npm run tauri -- build

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paperpilot-studio-tauri-windows
          path: |
            studio-tauri/src-tauri/target/release/bundle/nsis/*.exe
            studio-tauri/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/studio-tauri-v')
        uses: softprops/action-gh-release@v2
        with:
          name: PaperPilot Studio ${{ github.ref_name }} (Tauri edition)
          files: |
            studio-tauri/src-tauri/target/release/bundle/nsis/*.exe
            studio-tauri/src-tauri/target/release/bundle/msi/*.msi
          body: |
            PaperPilot Studio (Tauri edition) for Windows. Download the NSIS
            .exe installer below (the .msi is for managed deployments).
