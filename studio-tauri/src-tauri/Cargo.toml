[package]
name = "paperpilot-studio"
version = "2.0.0"
description = "PaperPilot Studio (Tauri edition) — native GUI for the PaperPilot core, ported to Rust"
authors = ["Abol — rconpilot"]
edition = "2021"

[lib]
name = "paperpilot_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "3", features = ["rustls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
